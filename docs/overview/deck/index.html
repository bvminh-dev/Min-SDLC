<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Neko Core × Min-SDLC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B2447;--blue:#1A66F5;--sky:#6AA9FF;--pale:#E8F1FF;--line:#C7DAFB;--mute:#5B7299}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff}
  #stage svg{position:absolute;inset:0}
  #cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:max-content;max-width:1560px;text-align:center;
    font-size:40px;font-weight:600;line-height:1.3;padding:14px 34px;border-radius:20px;color:var(--ink);
    background:rgba(255,255,255,.94);box-shadow:0 10px 40px rgba(26,102,245,.16);border:2px solid var(--line);opacity:0}
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;color:var(--blue);
    background:#fff;border:3px solid var(--line);border-radius:24px;padding:24px 44px;box-shadow:0 20px 60px rgba(26,102,245,.2)}
  #clock{position:absolute;right:40px;top:26px;font:700 26px 'JetBrains Mono',monospace;color:var(--mute)}
  body.rec #hint,body.rec #clock{display:none}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient>
      <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#CFE0FF"/></pattern>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A66F5" flood-opacity=".15"/></filter>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect width="1920" height="1080" fill="url(#bg)"/>
    <rect width="1920" height="1080" fill="url(#dots)" opacity=".55"/>
    <g id="scenes"></g>
    <g id="chrome"></g>
  </svg>
  <div id="cap"></div>
  <div id="clock"></div>
  <div id="hint">Nhấn Space để bắt đầu · ← → đổi cảnh · R quay lại đầu</div>
</div>
<script>
'use strict';
/* ---------- tiện ích ---------- */
const NS='http://www.w3.org/2000/svg';
const INK='#0B2447',BLUE='#1A66F5',SKY='#6AA9FF',PALE='#E8F1FF',LINE='#C7DAFB',MUTE='#5B7299',
      CORAL='#F0506E',AMBER='#F5A524',MINT='#12A67F';
const FONT="'Be Vietnam Pro',system-ui,sans-serif",MONO="'JetBrains Mono',ui-monospace,Menlo,monospace";
const $=(tag,a,p)=>{const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const S=(e,a)=>{for(const k in a)e.setAttribute(k,a[k]);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const O=x=>1-Math.pow(1-x,3);
const B=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // back-out (nảy nhẹ)
const lerp=(a,b,t)=>a+(b-a)*t;
const hsh=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const T=(p,x,y,str,o={})=>{const e=$('text',{x,y,'font-size':o.size||32,'font-weight':o.weight||600,fill:o.fill||INK,
  'text-anchor':o.anchor||'start','font-family':o.mono?MONO:FONT},p);e.textContent=str;return e};
const TL=(p,x,y,lines,o={},lh=1.25)=>{const g=$('g',{},p);lines.forEach((s,i)=>T(g,x,y+i*(o.size||32)*lh,s,o));return g};
const vis=(e,o)=>e.setAttribute('opacity',o);
const pth=(p,d,a={})=>$('path',Object.assign({d,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1,fill:'none',stroke:BLUE,
  'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},a),p);
const dr=(e,p)=>{S(e,{'stroke-dashoffset':1-p,opacity:p>0.001?1:0})};
const chip=(p,x,y,w,h,label,o={})=>{const g=$('g',{},p);
  $('rect',{x,y,width:w,height:h,rx:o.r??h/2,fill:o.fill||'#fff',stroke:o.stroke||LINE,'stroke-width':o.sw||3},g);
  T(g,x+w/2,y+h/2+(o.size||26)*.35,label,{size:o.size||26,weight:o.weight||700,fill:o.color||INK,anchor:'middle',mono:o.mono});return g};
const card=(p,x,y,w,h,o={})=>$('rect',{x,y,width:w,height:h,rx:o.r||28,fill:o.fill||'#fff',stroke:o.stroke||LINE,'stroke-width':o.sw||3,filter:o.noshadow?'':'url(#sh)'},p);
function cube(p,cx,cy,w,h,cols){ // khối iso: (cx,cy) là đỉnh dưới
  cols=cols||['#DDEBFF','#9EC4FF','#6AA2F5'];
  const g=$('g',{},p),pt=a=>a.map(q=>q.join(',')).join(' ');
  const Bm=[cx,cy],R=[cx+w,cy-w/2],L=[cx-w,cy-w/2],K=[cx,cy-w];
  const up=q=>[q[0],q[1]-h];
  $('polygon',{points:pt([L,Bm,up(Bm),up(L)]),fill:cols[1]},g);
  $('polygon',{points:pt([R,Bm,up(Bm),up(R)]),fill:cols[2]},g);
  $('polygon',{points:pt([up(L),up(Bm),up(R),up(K)]),fill:cols[0]},g);
  return g}
const gearPath=(r1,r2,n)=>{let d='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=Math.PI*2/n;
  const p=[[r1,a],[r2,a+b*.12],[r2,a+b*.38],[r1,a+b*.5]];
  p.forEach((q,j)=>{d+=(i+j?'L':'M')+(Math.cos(q[1])*q[0]).toFixed(1)+','+(Math.sin(q[1])*q[0]).toFixed(1)})}return d+'Z'};
const fmt=n=>Math.round(n).toLocaleString('vi-VN');

/* con mèo vẽ tay (đầu mèo = khung terminal: mắt ">" "<") */
function cat(g,x,y,s){
  const c=$('g',{transform:`translate(${x} ${y}) scale(${s})`},g);
  const head=pth(c,'M-150,-10 C-150,-120 -90,-165 0,-165 C90,-165 150,-120 150,-10 C150,90 90,130 0,130 C-90,130 -150,90 -150,-10 Z',{fill:PALE,'fill-opacity':0,'stroke-width':8});
  const earL=pth(c,'M-143,-62 L-128,-205 L-42,-158',{'stroke-width':8}),earR=pth(c,'M143,-62 L128,-205 L42,-158',{'stroke-width':8});
  const inL=pth(c,'M-120,-104 L-113,-166 L-76,-146',{stroke:SKY,'stroke-width':6}),inR=pth(c,'M120,-104 L113,-166 L76,-146',{stroke:SKY,'stroke-width':6});
  const eyes=$('g',{},c);
  const eL=pth(eyes,'M-78,-30 L-40,-8 L-78,14',{stroke:INK,'stroke-width':9}),eR=pth(eyes,'M78,-30 L40,-8 L78,14',{stroke:INK,'stroke-width':9});
  const nose=pth(c,'M-11,30 L11,30 L0,43 Z',{stroke:SKY,'stroke-width':6,fill:SKY,'fill-opacity':0});
  const mouth=pth(c,'M-30,58 Q-15,76 0,54 Q15,76 30,58',{stroke:INK,'stroke-width':6});
  const wh=[['M-112,30 L-196,14'],['M-112,52 L-202,54'],['M-110,74 L-190,94'],['M112,30 L196,14'],['M112,52 L202,54'],['M110,74 L190,94']].map(d=>pth(c,d[0],{stroke:SKY,'stroke-width':5}));
  return lt=>{
    dr(head,seg(lt,.2,1.9));S(head,{'fill-opacity':seg(lt,2.4,3.4)});
    dr(earL,seg(lt,1.5,2.3));dr(earR,seg(lt,1.7,2.5));dr(inL,seg(lt,2.2,2.8));dr(inR,seg(lt,2.3,2.9));
    dr(eL,seg(lt,2.7,3.3));dr(eR,seg(lt,2.8,3.4));dr(nose,seg(lt,3.2,3.6));S(nose,{'fill-opacity':seg(lt,3.4,3.9)});dr(mouth,seg(lt,3.4,4));
    wh.forEach((w,i)=>dr(w,seg(lt,3.8+i*.12,4.6+i*.12)));
    const bl=[7,11.5,14].reduce((m,b)=>Math.max(m,1-cl(Math.abs(lt-b)/.14)),0);
    S(eyes,{transform:`translate(0 -8) scale(1 ${1-.9*bl}) translate(0 8)`});
    // thở nhẹ
    S(c,{transform:`translate(${x} ${y+Math.sin(lt*2)*4*seg(lt,4.5,6)}) scale(${s})`});
  }}

/* ---------- cảnh ---------- */
const scenes=[];
const add=(t0,d,build,cues)=>scenes.push({t0,d,build,cues:cues.map(c=>[t0+c[0],t0+c[1],c[2]])});

/* 0 — Mở đầu (0–24) */
add(0,24,g=>{
  const hl=T(g,960,160,'AI viết code rất nhanh.',{size:78,weight:800,anchor:'middle'});
  const win=$('g',{},g);
  card(win,360,230,1200,580);
  $('rect',{x:360,y:230,width:1200,height:66,rx:30,fill:PALE},win);$('rect',{x:360,y:262,width:1200,height:34,fill:PALE},win);
  [CORAL,AMBER,MINT].forEach((c,i)=>$('circle',{cx:404+i*36,cy:263,r:10,fill:c},win));
  T(win,960,272,'terminal',{size:22,mono:1,fill:MUTE,anchor:'middle'});
  const cp=$('clipPath',{id:'c0'},win);$('rect',{x:380,y:312,width:1160,height:480},cp);
  const rg=$('g',{'clip-path':'url(#c0)'},win);
  const rows=[...Array(14)].map(()=>$('rect',{height:16,rx:8},rg));
  const big=T(g,960,560,'Nhưng ai dám tin nó?',{size:112,weight:800,anchor:'middle'});
  S(big,{stroke:'#fff','stroke-width':22,'paint-order':'stroke','stroke-linejoin':'round'});
  const ul=pth(g,'M 330,600 Q 960,640 1590,596',{stroke:BLUE,'stroke-width':10});
  const c1=chip(g,310,760,640,76,'Phần 1 · Chú mèo — Neko Core',{size:30,stroke:BLUE,color:BLUE});
  const c2=chip(g,970,760,640,76,'Phần 2 · Đường ray — Min-SDLC',{size:30,fill:BLUE,stroke:BLUE,color:'#fff'});
  return lt=>{
    const hp=O(seg(lt,.2,1.2));S(hl,{opacity:hp*(1-seg(lt,12.6,13.6)),transform:`translate(0 ${(1-hp)*24})`});
    const p=seg(lt,.5,12.4),sc=3800*(1-Math.pow(1-p,3)),base=Math.floor(sc/40),off=sc%40;
    rows.forEach((r,j)=>{const k=base+j;S(r,{x:404+Math.floor(hsh(k*3.1)*4)*46,y:318+j*40-off,width:90+hsh(k)*520,
      fill:hsh(k*7)>.8?BLUE:(hsh(k*5)>.5?'#BFD7FF':'#DCE9FF')})});
    const q=E(seg(lt,12.8,15.2));
    S(win,{opacity:1-.84*q,transform:`translate(960 520) scale(${1-.1*q}) translate(-960 -520)`});
    const bp=B(seg(lt,13.6,14.6));S(big,{opacity:seg(lt,13.6,14.2),transform:`translate(960 560) scale(${.9+.1*bp}) translate(-960 -560)`});
    dr(ul,seg(lt,15,16.6));
    const a=B(seg(lt,19.4,20.2)),b=B(seg(lt,20.6,21.4));
    S(c1,{opacity:seg(lt,19.4,19.9),transform:`translate(0 ${(1-a)*30})`});S(c2,{opacity:seg(lt,20.6,21.1),transform:`translate(0 ${(1-b)*30})`});
  }},[[.5,7,'Hôm nay, một trợ lý AI có thể viết hàng nghìn dòng code chỉ trong vài phút.'],
      [7.2,10,'Nhưng nhanh thì chưa đủ.'],
      [10.2,19,'Khi nó tự sửa file, tự chạy lệnh ngay trên máy của bạn — ai bảo đảm nó làm đúng?'],
      [19.2,24,'Chúng tôi xin kể bằng hai phần: một chú mèo, và một đường ray.']]);

/* 1 — Neko Core xuất hiện (24–40) */
add(24,16,g=>{
  const up=cat(g,960,350,1.05);
  const t1=T(g,960,640,'Neko Core',{size:130,weight:800,anchor:'middle',fill:INK});
  const t2=T(g,960,716,'Một chú mèo trong terminal',{size:48,weight:600,anchor:'middle',fill:BLUE});
  const cs=[['1 tệp thực thi duy nhất',470],['TypeScript · Bun · Ink',470],['Mô hình nào cũng cắm được',520]];
  const gap=36,tot=cs.reduce((s,c)=>s+c[1],0)+gap*2;let x=960-tot/2;
  const chips=cs.map(c=>{const e=chip(g,x,780,c[1],68,c[0],{size:27,stroke:LINE});x+=c[1]+gap;return e});
  return lt=>{up(lt);
    const a=O(seg(lt,4,5.2));S(t1,{opacity:a,transform:`translate(0 ${(1-a)*26})`});
    const b=O(seg(lt,5.2,6.4));S(t2,{opacity:b,transform:`translate(0 ${(1-b)*20})`});
    chips.forEach((c,i)=>{const p=B(seg(lt,8+i*.9,8.9+i*.9));S(c,{opacity:seg(lt,8+i*.9,8.5+i*.9),transform:`translate(0 ${(1-p)*30})`})});
  }},[[.3,4,'Chú mèo ấy tên là Neko Core.'],
      [4.2,11.5,'Một trợ lý lập trình chạy ngay trong terminal, do Meiiie và The Wiii Lab phát triển.'],
      [11.7,16,'Gói gọn trong một tệp duy nhất — không cần cài thêm gì.']]);

/* 2 — Vòng lặp tác tử (40–85) */
add(40,45,g=>{
  const cx=800,cy=520,rx=400,ry=170;
  const head=T(g,960,120,'Vòng lặp của tác tử',{size:58,weight:800,anchor:'middle'});
  const track=$('ellipse',{cx,cy,rx,ry,fill:'none',stroke:'#D5E4FF','stroke-width':22},g);
  const flow=$('ellipse',{cx,cy,rx,ry,fill:'none',stroke:BLUE,'stroke-width':4,'stroke-dasharray':'3 26','stroke-linecap':'round'},g);
  const pos=a=>[cx+rx*Math.cos(a*Math.PI/180),cy+ry*Math.sin(a*Math.PI/180)];
  const st=[{a:-90,n:'Mô hình',s:'complete'},{a:30,n:'Công cụ',s:'tool calls'},{a:150,n:'Quan sát',s:'observe'}].map((o,i)=>{
    const [x,y]=pos(o.a),gg=$('g',{},g);
    $('ellipse',{cx:x,cy:y+8,rx:78,ry:30,fill:'#BBD3FA',opacity:.5},gg);
    cube(gg,x,y,56,64);
    const glow=$('circle',{cx:x,cy:y-96,r:56,fill:SKY,filter:'url(#glow)',opacity:0},gg);
    const ic=$('g',{transform:`translate(${x} ${y-96})`},gg);
    if(i===0){$('circle',{r:26,fill:BLUE},ic);$('circle',{r:9,fill:'#fff'},ic);[0,60,120,180,240,300].forEach(d=>$('line',{x1:0,y1:0,x2:Math.cos(d*Math.PI/180)*46,y2:Math.sin(d*Math.PI/180)*46,stroke:SKY,'stroke-width':4},ic))}
    if(i===1){var gear=$('path',{d:gearPath(26,38,8),fill:BLUE},ic);$('circle',{r:10,fill:'#fff'},ic)}
    if(i===2){$('path',{d:'M-46,0 Q0,-40 46,0 Q0,40 -46,0Z',fill:'#fff',stroke:BLUE,'stroke-width':6},ic);$('circle',{r:15,fill:BLUE},ic);var pupil=$('circle',{r:6,fill:'#fff'},ic)}
    if(i===0){T(gg,x+100,y-110,o.n,{size:36,weight:800});T(gg,x+100,y-76,o.s,{size:22,mono:1,fill:MUTE})}
    else{T(gg,x,y+92,o.n,{size:36,weight:800,anchor:'middle'});T(gg,x,y+126,o.s,{size:22,mono:1,fill:MUTE,anchor:'middle'})}
    return {g:gg,glow,a:o.a,gear,pupil,ic}});
  const tok=$('g',{},g);$('circle',{r:26,fill:BLUE,opacity:.25,filter:'url(#glow)'},tok);$('circle',{r:15,fill:BLUE,stroke:'#fff','stroke-width':4},tok);
  const chipsT=['giải phóng ngữ cảnh','thoát vòng lặp kẹt','theo dõi nợ kiểm chứng'];
  const chips=chipsT.map((s,i)=>chip(g,230+i*400,812,370,60,s,{size:25,stroke:LINE}));
  // thẻ chế độ vòng kín
  const cd=$('g',{},g);
  card(cd,1400,220,440,520,{stroke:BLUE});
  T(cd,1620,285,'Chế độ vòng kín',{size:36,weight:800,anchor:'middle',fill:BLUE});
  const rowsC=[['Chốt tiêu chí “xong”','trước khi viết code'],['Triển khai','vòng lặp như bên trái'],['Kiểm định độc lập','chấm theo tiêu chí đã chốt']].map((r,i)=>{
    const y=350+i*125,gg=$('g',{},cd);$('circle',{cx:1450,cy:y+20,r:24,fill:BLUE},gg);T(gg,1450,y+30,String(i+1),{size:28,weight:800,fill:'#fff',anchor:'middle'});
    T(gg,1492,y+14,r[0],{size:29,weight:700});T(gg,1492,y+52,r[1],{size:24,weight:400,fill:MUTE});return gg});
  const lock=$('g',{transform:'translate(1478 346)'},cd);$('rect',{x:-14,y:-4,width:28,height:22,rx:5,fill:AMBER},lock);$('path',{d:'M-8,-4 V-12 A8,8 0 0 1 8,-12 V-4',fill:'none',stroke:AMBER,'stroke-width':5},lock);
  const stamp=$('g',{},cd);$('circle',{r:56,fill:'none',stroke:MINT,'stroke-width':8},stamp);$('circle',{r:46,fill:'none',stroke:MINT,'stroke-width':2},stamp);T(stamp,0,12,'ĐẠT',{size:38,weight:800,fill:MINT,anchor:'middle'});
  return lt=>{
    vis(head,O(seg(lt,0,.8)));
    const tp=seg(lt,.6,3);S(track,{opacity:tp});S(flow,{opacity:tp,'stroke-dashoffset':-lt*30});
    st.forEach((s,i)=>{const p=B(seg(lt,1+i*.7,2+i*.7));S(s.g,{opacity:seg(lt,1+i*.7,1.6+i*.7),transform:`translate(0 ${(1-p)*-40})`})});
    const run=lt>=5,th=-90+360*(lt-5)/7,[tx,ty]=pos(th);
    S(tok,{transform:`translate(${tx} ${ty})`,opacity:run?1:0});
    st.forEach(s=>{let d=Math.abs(((th-s.a+540)%360)-180);d=180-d; // 0 khi trùng
      const l=run?cl(1-d/45):0;S(s.glow,{opacity:l});
      if(s.gear)S(s.gear,{transform:`rotate(${lt*70})`});
      if(s.pupil)S(s.pupil,{transform:`translate(${Math.sin(lt*1.6)*8} ${Math.cos(lt*2.2)*3})`});
      S(s.ic,{transform:s.ic.getAttribute('transform').replace(/ scale\([^)]*\)/,'')+` scale(${1+.14*l})`})});
    chips.forEach((c,i)=>{const p=B(seg(lt,17+i*3.4,18+i*3.4));S(c,{opacity:seg(lt,17+i*3.4,17.6+i*3.4),transform:`translate(0 ${(1-p)*26})`})});
    const cp=O(seg(lt,26,27.4));S(cd,{opacity:cp,transform:`translate(${(1-cp)*80} 0)`});
    rowsC.forEach((r,i)=>vis(r,seg(lt,28+i*4.5,28.8+i*4.5)));
    S(lock,{opacity:seg(lt,29.4,30)*(1-seg(lt,40,40.4))});
    const sp=B(seg(lt,41,42));S(stamp,{opacity:seg(lt,41,41.4),transform:`translate(1690 640) rotate(-14) scale(${.4+.6*sp})`});
  }},[[.3,6,'Bên trong, Neko chạy một vòng lặp rất giản dị.'],
      [6.2,15,'Hỏi mô hình. Chạy công cụ. Quan sát kết quả. Rồi lặp lại.'],
      [15.2,27,'Quanh vòng lặp là những cơ chế giữ nó khỏi lạc hướng: giải phóng ngữ cảnh, thoát vòng kẹt, theo dõi nợ kiểm chứng.'],
      [27.2,36,'Ở chế độ vòng kín, tiêu chí “xong” được chốt từ trước khi viết code.'],
      [36.2,44.5,'Rồi một bộ kiểm định độc lập chấm kết quả — không phải chính AI tự chấm.']]);

/* 3 — Dây an toàn (85–130) */
add(85,45,g=>{
  const head=T(g,960,130,'Một ranh giới duy nhất',{size:58,weight:800,anchor:'middle'});
  const LY=560,XG=960;
  const belt=$('rect',{x:300,y:LY-32,width:1400,height:64,rx:32,fill:'#DCE9FF'},g);
  const ticks=$('g',{},g);for(let i=0;i<40;i++)$('rect',{x:300+i*38,y:LY-5,width:18,height:10,rx:5,fill:'#fff'},ticks);

const TOTAL=360;

const cues=scenes.flatMap(s=>s.cues);

function render(t){
  for(const s of scenes){const lt=t-s.t0,on=lt>=-1e-3&&lt<=s.d+1e-3;

  if(ci!==lastCue){cap.textContent=ci>=0?cues[ci][2]:'';lastCue=ci}
